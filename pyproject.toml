[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workaid"
version = "0.1.0"
description = "Intent-routed LangGraph legal assistance workspace"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "langgraph>=0.2,<2",
    "langchain-openai>=0.2,<2",
    "python-dotenv>=1.0,<2",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "chromadb>=1.5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "rag*"]

[tool.setuptools.package-data]
rag = ["data/**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
